# ==========================================
# SERVER
# ==========================================
server.port=8080

# ==========================================
# MYSQL DATABASE CONNECTION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/soslive_prod?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=sosplapp
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONNECTION POOL (HikariCP)
# ==========================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=SosLiveProdHikariPool

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# LOGGING
# ==========================================
logging.level.org.hibernate.SQL=${APP_LOG_LEVEL}
logging.level.org.hibernate.orm.jdbc.bind=${APP_LOG_LEVEL}

logging.file.name=/opt/javaapp/logs/app.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14

# ==========================================
# JWT CONFIGURATION
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ==========================================
# CROSS SCHEMA CONFIGURATION
# ==========================================
app.schema.attendance=sospl_attendance