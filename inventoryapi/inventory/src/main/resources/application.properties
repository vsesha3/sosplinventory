# ==========================================
# APPLICATION (common to all environments)
# ==========================================
spring.application.name=soslivedev

# ==========================================
# JPA / HIBERNATE (defaults, can be overridden per profile)
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ==========================================
# FLYWAY
# ==========================================
spring.flyway.enabled=false

# ==========================================
# ACTIVE PROFILE
# Override this at runtime with --spring.profiles.active=prod
# or the SPRING_PROFILES_ACTIVE env var. Defaults to dev for
# safety when running locally in the IDE without an explicit flag.
# ==========================================
spring.profiles.active=dev