# ==========================================
# APPLICATION
# ==========================================
spring.application.name=soslivedev
server.port=8080

# ==========================================
# MYSQL DATABASE CONNECTION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3308/soslivedev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Reset#123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONNECTION POOL (HikariCP - default)
# ==========================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=SosLiveDevHikariPool

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ==========================================
# FLYWAY CONFIGURATION
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.table=sos_flyway_schema_history


# ==========================================
# LOGGING
# ==========================================
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.soslivedev=DEBUG


# ==========================================
# JWT CONFIGURATION
# ==========================================
# JWT
app.jwt.secret=soslivedev_super_secret_key_must_be_at_least_256_bits_long_for_hs256
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000