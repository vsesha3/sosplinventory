# ══════════════════════════════════════════════════════════
#  Oracle → MySQL Migration Configuration
# ══════════════════════════════════════════════════════════

# ── Oracle Source ──────────────────────────────────────────
# Format: jdbc:oracle:thin:@<host>:<port>:<SID>
#      OR jdbc:oracle:thin:@//<host>:<port>/<ServiceName>

oracle.url=jdbc:oracle:thin:@//192.168.10.201:1521/xepdb1
oracle.username=SOSPL_NEW1904
oracle.password=oAutoTest2022

# Oracle schema/owner to read tables from (leave blank to use default)
oracle.schema=SOSPL_NEW1904

# ── MySQL Target ───────────────────────────────────────────
# rewriteBatchedStatements=true is already set in code (via HikariCP)
mysql.url=jdbc:mysql://localhost:3308/soslivedev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
mysql.username=root
mysql.password=Reset#123

# ── Tables to Migrate ──────────────────────────────────────
# Comma-separated list of Oracle table names (UPPERCASE)
# They must already exist in MySQL (same structure, lowercase names)
migration.tables=SOS_PRODUCT_GROUP_MASTER_T

# ── Optional: Remap table names (Oracle → MySQL) ──────────
# If Oracle and MySQL table names differ, add mappings like:
# table.map.ORACLE_TABLE_NAME=mysql_table_name
# Example:
# table.map.EMP=employees
# table.map.DEPT=departments

# ── Performance Settings ───────────────────────────────────
# Number of rows per batch INSERT
migration.batch_size=1000

# Number of tables to migrate in parallel (one thread per table)
# Recommended: 2–4 for medium datasets on standard hardware
migration.threads=4

# Truncate target MySQL table before inserting (safe for re-runs)
# Set to false if you want to append data instead
migration.truncate_before=true
